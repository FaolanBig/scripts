x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILE:-10}"
    compress: "true"

services:
  windmill_worker:
    image: "${WM_IMAGE:-ghcr.io/windmill-labs/windmill:1.883.0}"
    pull_policy: missing
    restart: unless-stopped
    privileged: true
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in worker.env}"
      MODE: worker
      WORKER_GROUP: "${WORKER_GROUP:-default}"
      FAVOR_UNSHARE_PID: "true"
      KEEP_JOB_DIR: "${KEEP_JOB_DIR:-false}"
    volumes:
      - /srv/data/windmill/cache:/tmp/windmill/cache
      - /srv/data/windmill/logs:/tmp/windmill/logs
      - /srv/config:/srv/config:ro
    logging: *default-logging

  windmill_worker_native:
    image: "${WM_IMAGE:-ghcr.io/windmill-labs/windmill:1.883.0}"
    pull_policy: missing
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in worker.env}"
      MODE: worker
      WORKER_GROUP: native
      NATIVE_MODE: "true"
      SLEEP_QUEUE: "${NATIVE_SLEEP_QUEUE:-200}"
    volumes:
      - /srv/data/windmill/native-logs:/tmp/windmill/logs
      - /srv/config:/srv/config:ro
    logging: *default-logging
