x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILE:-10}"
    compress: "true"

services:
  db:
    image: postgres:18
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - /srv/db:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in master.env}"
      POSTGRES_DB: "${POSTGRES_DB:-windmill}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-windmill}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  windmill_server:
    image: "${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}"
    pull_policy: always
    restart: unless-stopped
    expose:
      - 8000
      - 2525
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in master.env}@db:5432/${POSTGRES_DB:-windmill}?sslmode=disable"
      MODE: server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /srv/data/windmill:/tmp/windmill
      - /srv/config:/srv/config:ro
    logging: *default-logging

  windmill_extra:
    image: ghcr.io/windmill-labs/windmill-extra:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - 3001
      - 3002
      - 3003
    environment:
      ENABLE_LSP: "true"
      ENABLE_MULTIPLAYER: "false"
      ENABLE_DEBUGGER: "true"
      DEBUGGER_PORT: "3003"
      ENABLE_NSJAIL: "false"
      REQUIRE_SIGNED_DEBUG_REQUESTS: "true"
      WINDMILL_BASE_URL: http://windmill_server:8000
    volumes:
      - /srv/data/windmill/lsp-cache:/pyls/.cache
      - /srv/config:/srv/config:ro
    logging: *default-logging

  caddy:
    image: ghcr.io/windmill-labs/caddy-l4:2.11.4-1
    restart: unless-stopped
    volumes:
      - /srv/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/data/caddy:/data
    ports:
      - "80:80"
      - "25:25"
      # - "443:443"
    environment:
      BASE_URL: ":80"
      ADDRESS: "0.0.0.0 ::"
    logging: *default-logging
